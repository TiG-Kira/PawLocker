[versions]
# —— 与 Miuix 0.9.4 官方构建矩阵对齐，避免 Kotlin metadata / Compose 版本错配 ——
agp = "9.4.1"
kotlin = "2.4.20"
compose-multiplatform = "1.12.0"
miuix = "0.9.4"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"

# Compose 运行时库的版本。它与 compose-multiplatform 插件版本长期同号，
# 但两者是独立的版本轴，所以单列一个 key，插件升版时不会被动跟着跳。
compose-libs = "1.12.0"

# —— Android ——
androidx-activity = "1.13.0"
androidx-fragment = "1.9.1"
androidx-biometric = "1.1.0"
androidx-camera = "1.6.2"
androidx-core = "1.19.1"
androidx-lifecycle = "2.11.0"

# —— Desktop (Windows) ——
jna = "5.19.1"

# —— 通用 ——
zxing = "3.5.4"
junit = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }

[libraries]
# Kotlin / 协程 / 序列化
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Compose 运行时 / 基础层
# Compose Multiplatform 1.12 起，`compose.runtime` / `compose.foundation` 这类
# 插件访问器已废弃（编译期会告警「Specify dependency directly」），
# 改为写直接坐标。module metadata 会自动挑 android / desktop 变体。
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-libs" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-libs" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-libs" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose-libs" }

# Miuix
# 注意：不要在这里声明 miuix-*-android 之类的别名 ——
# 版本目录的访问器是「别名里的 - 变成 .」，miuix-ui 与 miuix-ui-android
# 会前缀冲突，导致前者被降级成一个分组而无法直接引用。
# Android 变体由 Gradle Module Metadata 自动选择，本来也不需要手动声明。
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

# CameraX（Android 扫码配对）
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }

# QR 生成（两端通用，纯 Java）
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# Windows 原生（DPAPI 加密 + 锁屏信号）
# 注意别名命名：`jna` 会被拆成 `libs.jna`，而它与 `jna-platform` 的前缀冲突，
# 所以基础库取名 jna-core（访问器 libs.jna.core），与 libs.jna.platform 平级。
jna-core = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

junit = { module = "junit:junit", version.ref = "junit" }
